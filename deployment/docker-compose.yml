services:
  # 0. One-shot Composer dependency install before the app starts. Mounts the
  #     same bind-mount directory as the app container, so every stack (re)start
  #     ensures vendor/ is present and up-to-date. The app container's chown
  #     fixes file ownership afterwards.
  composer_init:
    image: composer:2
    container_name: form-reisinger-pictures-composer
    volumes:
      - /home/webadmin/websites/form.reisinger.pictures:/app:Z
    command: install --ignore-platform-reqs --no-interaction --optimize-autoloader

  # 1. The live container for the web form.
  #
  #     Mail transport: Zoho Mail via SMTP basic auth
  #     (auth_type=password in config.php). The app-specific password is
  #     injected via REISINGER_PICTURES_SMTP_PASSWORD (AGENTS.md §2). Zoho
  #     app passwords are long-lived but can be revoked, so no OAuth
  #     sidecar/monitoring container is needed.
  app:
    image: ghcr.io/reisi007/php-base:8.5
    container_name: form-reisinger-pictures
    restart: unless-stopped
    depends_on:
      composer_init:
        condition: service_completed_successfully
    volumes:
      - /home/webadmin/websites/form.reisinger.pictures:/var/www/html
    command: >
      sh -c '
      chown -R www-data:www-data /var/www/html;
      exec php-fpm
      '
    environment:
      # --- reisinger.pictures: SMTP credentials (auth_type=password, Zoho Mail) ---
      # The per-domain environment variables map to the 'reisinger.pictures'
      # block in config.php (see AGENTS.md §2).
      #
      # Single source of truth: the non-secret defaults (host, port, encryption,
      # username, from) live ONLY in config.php. Compose deliberately forwards
      # them empty (`:-`), so a missing Portainer value falls back to config.php
      # instead of silently overriding it with a stale provider endpoint. The
      # password is a secret and has no default anywhere: it MUST be set in
      # Portainer, otherwise mailer_phpmailer.php fails fast with a clear error.
      - REISINGER_PICTURES_SMTP_PASSWORD=${REISINGER_PICTURES_SMTP_PASSWORD:-}
      - REISINGER_PICTURES_SMTP_HOST=${REISINGER_PICTURES_SMTP_HOST:-}
      - REISINGER_PICTURES_SMTP_PORT=${REISINGER_PICTURES_SMTP_PORT:-}
      - REISINGER_PICTURES_SMTP_ENCRYPTION=${REISINGER_PICTURES_SMTP_ENCRYPTION:-}
      - REISINGER_PICTURES_SMTP_USERNAME=${REISINGER_PICTURES_SMTP_USERNAME:-}
    networks:
      - webnet

networks:
  webnet:
    external: true
