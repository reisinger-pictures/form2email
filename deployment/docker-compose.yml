services:
  # 0. One-shot Composer dependency install before the app starts. Mounts the
  #     same bind-mount directory as the app container, so every stack (re)start
  #     ensures vendor/ is present and up-to-date. The app container's chown
  #     fixes file ownership afterwards.
  composer_init:
    image: composer:2
    container_name: form-reisinger-pictures-composer
    volumes:
      - /home/webadmin/websites/form.reisinger.pictures:/app:Z
    command: install --ignore-platform-reqs --no-interaction --optimize-autoloader

  # 1. The live container for the web form.
  #
  #     Mail transport: Zoho ZeptoMail via SMTP basic auth
  #     (auth_type=password in config.php). The API key is injected via
  #     REISINGER_PICTURES_SMTP_PASSWORD (AGENTS.md §2). ZeptoMail uses a
  #     static API key with no token expiry, so no OAuth sidecar/monitoring
  #     container is needed anymore.
  app:
    image: ghcr.io/reisi007/php-base:8.5
    container_name: form-reisinger-pictures
    restart: unless-stopped
    depends_on:
      composer_init:
        condition: service_completed_successfully
    volumes:
      - /home/webadmin/websites/form.reisinger.pictures:/var/www/html
    command: >
      sh -c '
      chown -R www-data:www-data /var/www/html;
      exec php-fpm
      '
    environment:
      # --- reisinger.pictures: SMTP credentials (auth_type=password, ZeptoMail) ---
      # The per-domain environment variables map to the 'reisinger.pictures'
      # block in config.php (see AGENTS.md §2).
      - REISINGER_PICTURES_SMTP_PASSWORD=${REISINGER_PICTURES_SMTP_PASSWORD:-}
      - REISINGER_PICTURES_SMTP_HOST=${REISINGER_PICTURES_SMTP_HOST:-smtp.zeptomail.eu}
      - REISINGER_PICTURES_SMTP_PORT=${REISINGER_PICTURES_SMTP_PORT:-587}
      - REISINGER_PICTURES_SMTP_ENCRYPTION=${REISINGER_PICTURES_SMTP_ENCRYPTION:-tls}
      - REISINGER_PICTURES_SMTP_USERNAME=${REISINGER_PICTURES_SMTP_USERNAME:-emailapikey}
    networks:
      - webnet

networks:
  webnet:
    external: true
